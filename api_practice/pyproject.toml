[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient nudges toward httpx2; httpx still works fine here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]  # pycodestyle errors/warnings + pyflakes (unused imports, undefined names)
